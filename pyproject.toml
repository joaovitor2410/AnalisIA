[project]
name = "olheiro"
version = "0.1.0"
description = "Agente de IA analista de dados: perguntas em português, respostas com SQL, tabela e gráfico como evidência."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "google-genai>=2.31.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pydantic-ai-slim[evals,google]>=2.59.0",
    "pydantic-settings>=2.16.0",
    "sqlglot>=30.24.0",
    "streamlit>=1.66.1",
]

[project.scripts]
olheiro-load = "olheiro.db:main"
olheiro-check = "olheiro.check_setup:main"
olheiro-ask = "olheiro.cli:main"
olheiro-eval = "olheiro.evaluation:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: erros básicos | I: ordem de imports | UP: sintaxe moderna | B: bugs comuns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# learning/ não é pacote: entra no path para os testes importarem os scripts de estudo
pythonpath = ["learning"]
# Aviso interno do pydantic_graph no run_sync (não é do nosso código; ver CLAUDE.md).
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning:pydantic_graph"]

[tool.mypy]
python_version = "3.13"
files = ["src"]

[[tool.mypy.overrides]]
# Bibliotecas sem tipos publicados (plotly) ou com tipos em pacote à parte (pandas-stubs).
module = ["plotly.*", "pandas.*"]
ignore_missing_imports = true
