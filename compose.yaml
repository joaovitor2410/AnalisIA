name: olheiro

services:
  app:
    build: .
    image: olheiro:local
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLHEIRO_MODEL: ${OLHEIRO_MODEL:-google:gemini-3.8-flash}
      OLHEIRO_FALLBACK_MODEL: ${OLHEIRO_FALLBACK_MODEL:-google:gemini-3.5-flash-lite}
      OLHEIRO_SESSION_QUESTION_LIMIT: ${OLHEIRO_SESSION_QUESTION_LIMIT:-5}
      OLHEIRO_DEMO_MODE: ${OLHEIRO_DEMO_MODE:-false}
      OLHEIRO_DEMO_MODEL_ENABLED: ${OLHEIRO_DEMO_MODEL_ENABLED:-false}
      OLHEIRO_DEMO_TOTAL_QUESTION_LIMIT: ${OLHEIRO_DEMO_TOTAL_QUESTION_LIMIT:-10}
      OLHEIRO_TRACING: file
      OLHEIRO_TRACE_CONTENT: "false"
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - state:/state
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    depends_on:
      egress:
        condition: service_healthy
    networks: [isolated]

  web:
    image: ghcr.io/nginx/nginx-unprivileged:1.30.6-alpine
    ports:
      - "127.0.0.1:${OLHEIRO_PORT:-8501}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:8080/_stcore/health | grep -qx ok"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [isolated, frontend]

  egress:
    build:
      context: .
      dockerfile: deploy/Dockerfile.egress
    image: olheiro-egress:local
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 256m
    pids_limit: 64
    networks: [isolated, outbound]

networks:
  isolated:
    internal: true
  outbound: {}
  frontend: {}

volumes:
  state: {}
