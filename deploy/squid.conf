# Só o túnel HTTPS da API configurada no projeto. Sem inspeção/interceptação de TLS.
http_port 3128
acl CONNECT method CONNECT
acl TLS_port port 443
acl model_api dstdomain -n generativelanguage.googleapis.com
http_access allow CONNECT TLS_port model_api
http_access deny all

cache deny all
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
netdb_filename none
pinger_enable off
coredump_dir /tmp
shutdown_lifetime 1 seconds
visible_hostname olheiro-egress
