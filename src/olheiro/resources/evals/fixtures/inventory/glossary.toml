rules = [
  "Dados sintéticos de estoque, sem informações de pessoas reais.",
  "sku é um identificador textual: 001, 01 e 1 são produtos diferentes.",
  "stock contém o saldo atual por produto e local, em unidades; some locais para obter o saldo por produto.",
  "quantity nula significa saldo desconhecido, nunca zero. Não classifique esse produto como abaixo do mínimo.",
  "Valor conhecido do estoque = quantity * unit_cost, só para SKUs cadastrados e quantidades conhecidas; explicite as exclusões.",
  "Reposição: soma das quantidades conhecidas menor que min_stock; produtos com qualquer saldo desconhecido ficam sem classificação.",
  "Há SKU sem cadastro e fornecedor sem cadastro. Não invente nomes nem descarte essas linhas em contagens do estoque.",
  "suppliers contém linhas idênticas duplicadas; use SELECT DISTINCT supplier_id, supplier_name antes de cruzar com medidas.",
  "Não existem vendas, histórico de movimentos, receita, demanda ou prazos de entrega nesta base.",
]

